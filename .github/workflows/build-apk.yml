name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VERSION" ]; then
            echo "Error: Unable to detect active Java major version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VERSION"
          if [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java version is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Keystore file ./debug.keystore was not created."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK $EXPECTED_APK missing!"
            echo "Searching inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: $EXPECTED_APK does not have .apk extension."; exit 1 ;;
          esac
          echo "Successfully verified $EXPECTED_APK."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TEMP_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$TEMP_DIR"
          REPO_NAME=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')
          ASSET_NAME="${REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          DEST_FILE="${TEMP_DIR}/${ASSET_NAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_FILE"
          if [ ! -f "$DEST_FILE" ] || [ ! -s "$DEST_FILE" ]; then
            echo "Error: Failed to prepare release asset at $DEST_FILE"
            exit 1
          fi
          echo "asset_path=${DEST_FILE}" >> $GITHUB_OUTPUT
          echo "asset_name=${ASSET_NAME}" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $DEST_FILE"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset missing or empty: $ASSET_PATH"
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Release asset is not an .apk file: $ASSET_PATH"; exit 1 ;;
          esac

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          - Workflow Run Number: ${{ github.run_number }}
          - Workflow Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${{ github.sha }}

          Note: This APK is intended for testing and is not a Play Store production release.
          It is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "$TAG_NAME"
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            echo "### 🚀 Debug APK Released Successfully" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK is directly available for download on your phone:" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Asset Filename:** \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_Note: The standard GitHub Actions artifact \`app-debug-apk\` is also stored as a backup._" >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            echo "The debug APK build succeeded and the artifact 'app-debug-apk' is available."

            echo "### ⚠️ Debug APK Built (Release Publishing Notice)" >> $GITHUB_STEP_SUMMARY
            echo "The APK build succeeded! However, publishing to GitHub Releases encountered an issue or failed." >> $GITHUB_STEP_SUMMARY
            echo "- **Backup Artifact Available:** You can download \`app-debug-apk\` from the Summary section of this workflow run." >> $GITHUB_STEP_SUMMARY
          fi
